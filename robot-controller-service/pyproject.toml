[project]
name = "robot-controller"
version = "0.1.0"
requires-python = ">=3.12"
# The Reachy Mini SDK runs on the robot (the reachy_booth app); this service
# only forwards motion frames to it over a websocket.
dependencies = [
    "opentelemetry-exporter-otlp-proto-grpc>=1.15.0",
    "workmesh",
    "aiohttp>=3.10",
]

[tool.uv.sources]
workmesh = { workspace = true }

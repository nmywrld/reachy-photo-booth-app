services:
  camera:
    restart: unless-stopped
    container_name: camera
    image: camera:latest
    depends_on:
      redpanda:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./pyproject.toml
        - action: sync+restart
          path: ./src
          target: /app/src
    build:
      context: ..
      dockerfile: camera-service/Dockerfile
    ports:
      - 7071:7071
    devices:
      - /dev:/dev
    volumes:
      - /dev:/dev
    configs:
      - source: config_camera
        target: /config.yaml

configs:
  config_camera:
    # Wireless Reachy Mini camera, served by the on-robot reachy_booth app
    # (port 8042; see docs/wireless-reachy-booth-app.md). Use the robot's IP:
    # mDNS names such as reachy-mini.local usually do not resolve in containers.
    #
    # The live stream (camera_frame topic, UI preview, person tracking) is
    # reduced to fit Wi-Fi: 640x360 at 12 fps, JPEG quality 65 is ~0.3 MB/s.
    # Photos (/capture) are fetched separately at the robot's full 1280x720.
    #
    # For a USB webcam instead, set camera_serial_or_url to its serial number
    # (see README.md) and the resolutions to what the webcam supports.
    content: |
      camera_serial_or_url: reachy://192.168.0.25
      fps: 12
      reachy_stream_quality: 65
      streaming_resolution:
        width: 640
        height: 360
      capture_resolution:
        width: 1280
        height: 720

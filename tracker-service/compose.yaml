services:
  tracker:
    restart: unless-stopped
    container_name: tracker
    hostname: tracker
    image: tracker:latest
    depends_on:
      redpanda:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./pyproject.toml
        - action: sync+restart
          path: ./src
          target: /app/src
    build:
      context: ..
      dockerfile: tracker-service/Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      # torchvision (SSDLite person detector) caches its weights in the volume too.
      - TORCH_HOME=/home/app/.torch/iopath_cache/torch
    volumes:
      # Keep downloaded weights across container restarts and rebuilds, so the
      # tracker doesn't need the internet at every start.
      - tracker_models:/home/app/.torch/iopath_cache

volumes:
  tracker_models: {}

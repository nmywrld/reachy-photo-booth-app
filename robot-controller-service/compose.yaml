services:
  robot-controller:
    restart: unless-stopped
    container_name: robot-controller
    image: robot-controller:latest
    depends_on:
      redpanda:
        condition: service_healthy
      agent:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./pyproject.toml
        - action: sync+restart
          path: ./src
          target: /app/src
    build:
      context: ..
      dockerfile: robot-controller-service/Dockerfile
    healthcheck:
        # Healthy once the reachy_booth app answers on the robot (see
        # docs/wireless-reachy-booth-app.md). Use the same IP as below.
        test: ["CMD", "curl", "-fsS", "http://192.168.0.25:8042/health"]
        start_period: 10m
        start_interval: 5s
        interval: 10s
        timeout: 5s
        retries: 5
    configs:
      - source: config_robot_controller
        target: /config.yaml

configs:
  config_robot_controller:
    content: |
      booth_app:
        # The reachy_booth app on the robot. Use the robot's IP: mDNS names
        # (reachy-mini.local) usually don't resolve inside containers.
        url: http://192.168.0.25:8042

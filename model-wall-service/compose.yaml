services:
  model-wall:
    restart: unless-stopped
    container_name: model-wall
    image: model-wall:latest
    depends_on:
      redpanda:
        condition: service_healthy
    build:
      context: ..
      dockerfile: model-wall-service/Dockerfile
    # Needed to attribute NVML's host PIDs to the containers that own them.
    pid: host
    cap_add:
      - SYS_PTRACE
    ports:
      - "9100:9100"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

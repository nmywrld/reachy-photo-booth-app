services:
  robot-controller:
    restart: unless-stopped
    container_name: robot-controller
    image: robot-controller:latest
    depends_on:
      redpanda:
        condition: service_healthy
      agent:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./pyproject.toml
        - action: sync+restart
          path: ./src
          target: /app/src
    build:
      context: ..
      dockerfile: robot-controller-service/Dockerfile
    healthcheck:
        # Healthy once the reachy_booth app answers on the robot (see
        # docs/wireless-reachy-booth-app.md). REACHY_HOST comes from the root .env.
        test: ["CMD", "curl", "-fsS", "http://${REACHY_HOST:?set REACHY_HOST in .env}:8042/health"]
        start_period: 10m
        start_interval: 5s
        interval: 10s
        timeout: 5s
        retries: 5
    configs:
      - source: config_robot_controller
        target: /config.yaml

configs:
  config_robot_controller:
    content: |
      booth_app:
        # The reachy_booth app on the robot. REACHY_HOST comes from the root .env
        # (scripts/reachy-ip.sh sets it); mDNS names (reachy-mini.local) usually
        # don't resolve inside containers, so it holds the robot's IP.
        url: http://${REACHY_HOST:?set REACHY_HOST in .env}:8042

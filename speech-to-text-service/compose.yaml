services:
  speech-to-text:
    restart: unless-stopped
    container_name: speech-to-text
    image: speech-to-text:latest
    depends_on:
      riva:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    develop:
      watch:
        - action: rebuild
          path: ./pyproject.toml
        - action: sync+restart
          path: ./src
          target: /app/src
    build:
      context: ..
      dockerfile: speech-to-text-service/Dockerfile
    devices:
      - /dev/snd:/dev/snd # Audio devices
    volumes:
      - /run/user/1000/pulse:/run/user/1000/pulse
      - /run/user/1000/pulse/native:/run/user/1000/pulse/native
      - /run/user/1000/pipewire-0:/run/user/1000/pipewire-0
      - /run/user/1000/pipewire-0.lock:/run/user/1000/pipewire-0.lock
      - /run/user/1000/pipewire-0-manager:/run/user/1000/pipewire-0-manager
      - /run/user/1000/pipewire-0-manager.lock:/run/user/1000/pipewire-0-manager.lock
    environment:
      - XDG_RUNTIME_DIR=/run/user/1000
      - PULSE_SERVER=unix:/run/user/1000/pulse/native
    # If u want to use reachy's original audio input, comment out everything below
    configs:
     - source: config_speech_to_text
       target: /config.yaml
     - source: alsa_booth_input
       target: /etc/alsa/conf.d/60-booth-input.conf

configs:
  # The service records from the "pipewire" device, i.e. through the host's
  # PipeWire, so any microphone the host sees works and PipeWire resamples to
  # sample_rate. Which microphone is set by AUDIO_SOURCE in the root .env.
  config_speech_to_text:
    content: |
      input_devices_index_or_name: ["pipewire"]
      audio_config:
        sample_rate: 48000

  # Which host microphone to record from: AUDIO_SOURCE in the root .env holds a
  # PipeWire source name (scripts/audio-input.sh lists and sets it). Empty means
  # the host's default input. If the named source disappears, PipeWire falls
  # back to the default input.
  alsa_booth_input:
    content: |
      defaults.pipewire.node "${AUDIO_SOURCE:--1}"
